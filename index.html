<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد سعيد 🎉</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- الخلفية المتحركة -->
        <div class="background-animation"></div>
        
        <!-- المحتوى الرئيسي -->
        <div class="content">
            <div class="balloons">
                <div class="balloon balloon-1"></div>
                <div class="balloon balloon-2"></div>
                <div class="balloon balloon-3"></div>
                <div class="balloon balloon-4"></div>
                <div class="balloon balloon-5"></div>
            </div>
            
            <h1 class="title">عيد ميلاد سعيد 🎂</h1>
            <p class="subtitle">كل سنة وأنت بألف خير</p>
            
            <div class="cake-emoji">🎂</div>
            
            <div class="message">
                <p>يوم خاص لشخص خاص</p>
                <p>🎈 نتمنى لك سنة مليئة بالفرح والسعادة 🎉</p>
            </div>
            
            <button class="surprise-btn" onclick="showSurprise()">اضغط هنا للمفاجأة 🎁</button>
            
            <div id="surprise" class="surprise hidden">
                <div class="confetti"></div>
                <p>🎊 مبروك! كل سنة وأنت أحلى! 🎊</p>
            </div>
            
            <div class="candles">
                <div class="candle">
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <div class="flame"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
